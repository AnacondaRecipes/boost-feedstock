anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://www.boost.org/releases/latest/
      regex: https://archives\.boost\.io/release/([\d.]+)/source/boost_(?:\d+_)+\d+\.tar\.bz2
    packages:
      - libboost
      - libboost-devel
      - libboost-headers
      - libboost-python
      - libboost-python-devel
